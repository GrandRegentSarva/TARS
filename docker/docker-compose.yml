# =============================================================================
# TARS -- Docker Compose
# =============================================================================
# Usage:
#   docker compose up              -- Start all services
#   docker compose up postgres     -- Start only PostgreSQL (Phase 2)
#   docker compose up px4-sitl     -- Start only PX4 SITL (Phase 1)
#   docker compose up -d           -- Start in background (detached)
#   docker compose down            -- Stop and remove containers
#   docker compose logs -f         -- Follow logs
#
# Phase 1: PX4 SITL + Gazebo headless simulation
# Phase 2: PostgreSQL for mission replay storage
# =============================================================================

services:
  # ===========================================================================
  # Phase 1 -- PX4 SITL + Gazebo Headless
  # ===========================================================================
  px4-sitl:
    build:
      context: .
      dockerfile: Dockerfile.px4-sitl
    container_name: tars-px4-sitl
    
    # Host networking -- simplest way to expose MAVLink UDP ports
    # PX4 SITL broadcasts on 14540 and 14550, and with host networking
    # your host machine can receive these broadcasts directly
    network_mode: host
    
    # Environment variables
    environment:
      # HEADLESS=1 tells Gazebo to skip 3D rendering (saves ~1GB RAM)
      - HEADLESS=1
      # PX4_HOME is where the PX4 source code lives inside the container
      - PX4_HOME=/root/PX4-Autopilot
    
    # Resource limits -- important for your 8GB RAM system
    # Prevents the container from consuming all available memory
    deploy:
      resources:
        limits:
          memory: 3g    # Cap at 3GB (leaves ~4GB for host + Python + QGC)
          cpus: "3"     # Use up to 3 of your 4 threads
    
    # Restart policy -- if PX4 crashes, restart it automatically
    restart: unless-stopped
    
    # Privileged mode needed for some PX4 SITL operations
    privileged: true

  # ===========================================================================
  # Phase 2 -- PostgreSQL (Mission Replay Store)
  # ===========================================================================
  # Durable storage for imported missions, telemetry events, and fault events.
  # Phase 2 can run independently of PX4 SITL -- no simulation needed.
  postgres:
    image: postgres:16-alpine
    container_name: tars-postgres
    environment:
      POSTGRES_DB: tars
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: tars
    ports:
      - "5432:5432"
    volumes:
      - tars-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tars -d tars"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Phase 3 -- Redis (Operational State Store)
  # ===========================================================================
  # Low-latency store for computed mission state snapshots.
  # Phase 3 State Engine writes current state, timelines, and processing
  # metadata here. Not the historical source of truth -- PostgreSQL remains
  # the durable mission history.
  redis:
    image: redis:7-alpine
    container_name: tars-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Phase 7 -- Neo4j (Operational Memory Graph)
  # ===========================================================================
  # Graph database for operational memory connecting missions, incidents,
  # root causes, mitigations, and outcomes. Phase 7 projects bounded facts
  # from Phases 2, 4, and 5 without replacing their source systems.
  #
  # Neo4j may be unavailable without affecting mission execution, replay,
  # incident detection, reasoning, or Phoenix tracing.
  neo4j:
    image: neo4j:5-community
    container_name: tars-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tarsneo4j}
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - tars-neo4j-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  tars-pgdata:
    driver: local
  tars-neo4j-data:
    driver: local
