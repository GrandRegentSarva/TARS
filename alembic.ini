# =============================================================================
# Alembic Configuration -- TARS Phase 2
# =============================================================================
# Run migrations:
#   PYTHONPATH=src alembic upgrade head
#   PYTHONPATH=src alembic revision --autogenerate -m "description"
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = src

# Connection string -- overridden at runtime by migrations/env.py
# using the Phase 2 config module. This is a fallback only.
sqlalchemy.url = postgresql://tars:tars@localhost:5432/tars

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
